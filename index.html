<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Speaking Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 max-w-4xl mx-auto p-6">

    <!-- Header & Config -->
    <header class="mb-8 border-b pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">German Speaking Coach</h1>
        </div>
        <div>
            <input type="password" id="apiKey" placeholder="Paste Gemini API Key" 
                   class="border border-slate-300 px-3 py-1.5 rounded-lg text-sm w-64 focus:outline-blue-500"
                   onchange="localStorage.setItem('gemini_key', this.value)">
        </div>
    </header>

    <!-- Recording Card -->
    <main class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-8">
        <!-- Target Banner for Retest (Round 2+) -->
        <div id="targetBanner" class="hidden mb-4 p-3 bg-blue-50 border-l-4 border-blue-500 rounded text-sm">
            <span class="font-bold text-blue-700">🎯 Practice Target:</span>
            <p id="targetText" class="text-blue-900 italic mt-1"></p>
            <button onclick="cancelRound2()" class="text-xs text-red-500 underline mt-2 inline-block">Cancel Retest (Back to Free Speech)</button>
        </div>

        <!-- Interactive Controls -->
        <div class="flex items-center gap-4 flex-wrap">
            <!-- 1. Record Button -->
            <button id="recordBtn" onclick="toggleRecording()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition">
                <span id="recordBtnIcon">🎤</span>
                <span id="recordBtnText">Start Recording</span>
            </button>
            
            <!-- 2. Preview & Delete Area (Visible after recording) -->
            <div id="audioPreviewGroup" class="hidden flex items-center gap-3 bg-slate-50 p-1.5 px-3 rounded-lg border border-slate-200">
                <span class="text-xs font-semibold text-slate-500">Listen:</span>
                <audio id="audioPreview" controls class="h-8 w-52"></audio>
                
                <!-- Delete/Discard Button (Disabled after successful analysis) -->
                <button id="deleteAudioBtn" onclick="deleteCurrentAudio()" 
                        title="Discard this recording and re-record"
                        class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-semibold px-2.5 py-1.5 rounded transition">
                    🗑️ Delete
                </button>
            </div>

            <!-- 3. Submit & Status Area -->
            <div class="ml-auto flex items-center gap-2">
                <span id="errorNotice" class="hidden text-xs text-red-600 bg-red-50 px-2.5 py-1.5 rounded border border-red-200">
                    ⚠️ Connection failed.
                </span>
                <button id="submitBtn" onclick="submitAudio()" disabled 
                        class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold px-6 py-2.5 rounded-lg transition">
                    🚀 Analyze
                </button>
            </div>
        </div>
    </main>

    <!-- History Thread -->
    <section>
        <h2 class="text-xl font-bold text-slate-900 mb-4">📜 Practice History</h2>
        <div id="historyList" class="space-y-4">
            <p class="text-slate-400 text-center py-8">Loading history...</p>
        </div>
    </section>

    <script>
        let mediaRecorder, audioChunks = [], currentBlob = null, activeParentId = null;
        let isAnalyzed = false; // Flag to prevent duplicate submissions or deletion of saved records

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            loadHistory();
        };

        async function toggleRecording() {
            const btnText = document.getElementById('recordBtnText');
            const btnIcon = document.getElementById('recordBtnIcon');
            const recordBtn = document.getElementById('recordBtn');

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // Stop recording
                mediaRecorder.stop();
                btnIcon.innerText = '🎤';
                btnText.innerText = 'Re-record';
                recordBtn.classList.remove('bg-red-600');
                recordBtn.classList.add('bg-slate-700');
            } else {
                // Prompt if discarding unsent audio
                if (currentBlob && !isAnalyzed) {
                    if (!confirm('You have an unsent recording. Discard it and record new audio?')) {
                        return;
                    }
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        currentBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(currentBlob);
                        
                        // Setup audio player
                        const preview = document.getElementById('audioPreview');
                        preview.src = audioUrl;
                        document.getElementById('audioPreviewGroup').classList.remove('hidden');

                        // Reset analysis states
                        isAnalyzed = false;
                        document.getElementById('errorNotice').classList.add('hidden');
                        
                        // Enable Delete button
                        const deleteBtn = document.getElementById('deleteAudioBtn');
                        deleteBtn.disabled = false;
                        deleteBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        deleteBtn.title = 'Discard this recording and re-record';

                        // Enable Submit button
                        const submitBtn = document.getElementById('submitBtn');
                        submitBtn.disabled = false;
                        submitBtn.innerText = '🚀 Analyze';
                        submitBtn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg transition';
                    };

                    mediaRecorder.start();
                    btnIcon.innerText = '⏹';
                    btnText.innerText = 'Stop Recording';
                    recordBtn.className = 'bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition';
                } catch (err) {
                    alert('Microphone access denied: ' + err.message);
                }
            }
        }

        function deleteCurrentAudio() {
            if (isAnalyzed) {
                alert('This recording has already been assessed and saved to history. It cannot be deleted.');
                return;
            }

            if (confirm('Are you sure you want to delete this recording?')) {
                currentBlob = null;
                audioChunks = [];
                
                // Hide preview and clear errors
                document.getElementById('audioPreviewGroup').classList.add('hidden');
                document.getElementById('audioPreview').src = '';
                document.getElementById('errorNotice').classList.add('hidden');

                // Reset Record Button
                const recordBtn = document.getElementById('recordBtn');
                recordBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition';
                document.getElementById('recordBtnText').innerText = 'Start Recording';

                // Disable Submit Button
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerText = '🚀 Analyze';
                submitBtn.className = 'bg-emerald-600 disabled:bg-slate-300 text-white font-semibold px-6 py-2.5 rounded-lg transition';
            }
        }

        async function submitAudio() {
            if (!currentBlob || isAnalyzed) return;

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return alert('Please enter your Gemini API Key!');

            const submitBtn = document.getElementById('submitBtn');
            const deleteBtn = document.getElementById('deleteAudioBtn');
            const errorNotice = document.getElementById('errorNotice');

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ Analyzing...';
            deleteBtn.disabled = true; // Prevent deletion during API call
            errorNotice.classList.add('hidden');

            const formData = new FormData();
            formData.append('audio', currentBlob, 'speech.webm');
            formData.append('api_key', apiKey);
            if (activeParentId) formData.append('parent_id', activeParentId);

            try {
                const res = await fetch('api.php', { method: 'POST', body: formData });
                
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Server connection error');
                }

                // ✅ Assessment Successful: Lock state, prevent delete & resubmit
                isAnalyzed = true;

                // Lock Delete button
                deleteBtn.disabled = true;
                deleteBtn.classList.add('opacity-50', 'cursor-not-allowed');
                deleteBtn.title = 'Saved to history (Cannot be deleted)';

                // Lock Submit button
                submitBtn.disabled = true;
                submitBtn.innerText = '✅ Assessed';
                submitBtn.className = 'bg-slate-300 text-slate-500 font-semibold px-6 py-2.5 rounded-lg cursor-not-allowed';

                cancelRound2();
                loadHistory(); 

            } catch (err) {
                // ❌ API Failure: Allow retry and deletion
                console.error('Submit failed:', err);
                
                errorNotice.classList.remove('hidden');
                deleteBtn.disabled = false; // Restore delete ability

                submitBtn.disabled = false;
                submitBtn.innerText = '🔁 Retry Send';
                submitBtn.className = 'bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-2.5 rounded-lg transition';
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('api.php?action=history');
                const data = await res.json();
                const listEl = document.getElementById('historyList');

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<p class="text-slate-400 text-center py-8">No records found.</p>';
                    return;
                }

                // Group history logically: nest retries (_1, _2) under parent
                const parentMap = {};
                const rootList = [];

                data.forEach(item => {
                    if (!item.parent_id) {
                        parentMap[item.id] = { ...item, children: [] };
                        rootList.push(parentMap[item.id]);
                    }
                });

                data.forEach(item => {
                    if (item.parent_id) {
                        const rootId = item.id.split('_')[0];
                        if (parentMap[rootId]) {
                            parentMap[rootId].children.push(item);
                        }
                    }
                });

                listEl.innerHTML = rootList.map(item => renderCard(item)).join('');
            } catch (err) {
                console.error('Failed to load history:', err);
            }
        }

        function renderCard(item, isChild = false) {
            // Using a 10-point scale format for final_score
            const rawScore = item.overall_score !== undefined ? item.overall_score : (item.final_score !== undefined ? item.final_score : 0);
            const displayScore = (rawScore > 10 ? rawScore / 10 : rawScore).toFixed(1);

            return `
                <div class="bg-white p-5 rounded-xl border ${isChild ? 'border-blue-200 bg-blue-50/30 ml-8 mt-3' : 'border-slate-200'} shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-slate-100 text-slate-700 font-bold rounded text-xs">${item.detected_level || 'A1'}</span>
                            <span class="text-xs text-slate-400">${item.timestamp}</span>
                            ${isChild ? '<span class="text-xs bg-emerald-100 text-emerald-700 font-semibold px-2 py-0.5 rounded">Retry Attempt</span>' : ''}
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-extrabold text-blue-600">${displayScore}</span>
                            <span class="text-xs text-slate-400">/ 10 pts</span>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2 rounded-lg mb-4 inline-block border border-slate-100">
                        <p class="text-[10px] text-slate-400 uppercase tracking-wide mb-1 font-semibold">Playback</p>
                        <audio src="data/${item.audio_file}" controls class="h-7 w-64"></audio>
                    </div>

                    <div class="space-y-2 text-sm">
                        <p class="text-slate-900 font-medium">🗣️ <strong>German:</strong> "${item.transcription}"</p>
                        <p class="text-slate-600">💡 <strong>Better Expression:</strong> <span class="text-emerald-600 font-medium">${item.improved_expression_de}</span></p>
                        <p class="text-slate-600">📝 <strong>Feedback (DE):</strong> ${item.feedback_de}</p>
                    </div>

                    <button onclick="startRound2('${item.id}', '${escapeHtml(item.improved_expression_de)}')" 
                            class="mt-4 text-xs font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition">
                        🔁 Practice Again
                    </button>

                    ${item.children && item.children.length > 0 ? item.children.map(child => renderCard(child, true)).join('') : ''}
                </div>
            `;
        }

        function startRound2(parentId, targetText) {
            activeParentId = parentId;
            document.getElementById('targetText').innerText = targetText;
            document.getElementById('targetBanner').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelRound2() {
            activeParentId = null;
            document.getElementById('targetBanner').classList.add('hidden');
        }

        function escapeHtml(str) { return (str || '').replace(/'/g, "\\'"); }
    </script>
</body>
</html>
